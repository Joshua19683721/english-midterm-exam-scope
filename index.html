<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>115-1 四年級英語期中考 · 300 題</title>
<style>
:root{
  --bg:#f2faf7;
  --card:#ffffff;
  --ink:#20302d;
  --muted:#6c7d79;
  --line:#e3ece9;
  --teal:#0d9f95;
  --teal-dark:#087a73;
  --teal-soft:#dff4f0;
  --maroon:#a33b55;
  --good:#138a5b;
  --bad:#c94a3a;
  --amber:#c07a12;
  --shadow:0 8px 26px rgba(20,60,50,.06);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  margin:0;background:
    radial-gradient(900px 420px at 12% -8%,#dff6ef 0%,rgba(223,246,239,0) 60%),
    radial-gradient(700px 360px at 100% 0%,#fff2e4 0%,rgba(255,242,228,0) 55%),
    var(--bg);
  color:var(--ink);
  font-family:"Noto Sans TC","Microsoft JhengHei","微軟正黑體",system-ui,-apple-system,"Segoe UI",sans-serif;
  font-size:16px;line-height:1.6;-webkit-font-smoothing:antialiased;
}
button{font:inherit;color:inherit;cursor:pointer}
button:disabled{cursor:not-allowed}
.shell{max-width:1080px;margin:0 auto;padding:18px 16px 80px}
.en{font-family:"Segoe UI","Trebuchet MS",system-ui,sans-serif}

/* ---------- buttons ---------- */
.btn{
  border:1px solid var(--line);background:#fff;border-radius:999px;padding:9px 18px;
  font-size:14px;font-weight:600;transition:.15s;display:inline-flex;align-items:center;
  justify-content:center;gap:7px;text-decoration:none;
}
.btn:hover:not(:disabled){transform:translateY(-1px);box-shadow:0 6px 16px rgba(20,60,50,.09)}
.btn:active:not(:disabled){transform:none}
.btn.primary{background:var(--teal);border-color:var(--teal);color:#fff;box-shadow:0 5px 14px rgba(13,159,149,.22)}
.btn.primary:hover:not(:disabled){background:var(--teal-dark);border-color:var(--teal-dark)}
.btn.ghost{background:transparent}
.btn.lg{padding:12px 22px;font-size:15px}
.btn.sm{padding:6px 13px;font-size:12.5px}
.btn[disabled]{opacity:.45;transform:none;box-shadow:none}
.iconbtn{
  width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:#fff;
  display:grid;place-items:center;font-size:17px;flex:0 0 auto;
}
.iconbtn:hover{background:#f5fbf9}

/* ---------- home ---------- */
.hero{
  position:relative;overflow:hidden;border-radius:24px;padding:30px 32px;
  background:linear-gradient(135deg,#0d9f95 0%,#36bfb2 55%,#77d5c8 100%);
  color:#fff;display:flex;gap:24px;align-items:center;justify-content:space-between;
  box-shadow:0 20px 44px rgba(13,159,149,.22);
}
.hero::before{
  content:"";position:absolute;width:320px;height:320px;border-radius:50%;
  background:rgba(255,255,255,.12);right:-90px;top:-150px;
}
.hero::after{
  content:"";position:absolute;width:220px;height:220px;border-radius:50%;
  background:rgba(255,255,255,.08);right:120px;bottom:-150px;
}
.hero-main{position:relative;z-index:1;min-width:0}
.eyebrow{font-size:12.5px;letter-spacing:.14em;opacity:.9;font-weight:600}
.hero h1{font-size:clamp(28px,4.2vw,44px);line-height:1.18;margin:7px 0 8px;letter-spacing:.02em}
.hero p{margin:0;opacity:.94;font-size:15px}
.hero-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:22px}
.hero .btn.primary{background:#fff;border-color:#fff;color:var(--teal-dark);box-shadow:0 8px 20px rgba(0,0,0,.12)}
.hero .btn.primary:hover{background:#f4fffd;border-color:#f4fffd}
.hero .btn.ghost{border-color:rgba(255,255,255,.7);color:#fff}
.hero .btn.ghost:hover{background:rgba(255,255,255,.14)}
.ring{
  --p:0;width:150px;aspect-ratio:1;border-radius:50%;flex:0 0 auto;position:relative;z-index:1;
  background:conic-gradient(#fff calc(var(--p)*1%),rgba(255,255,255,.24) 0);
  display:grid;place-items:center;box-shadow:inset 0 0 0 1px rgba(255,255,255,.25);
}
.ring-in{
  width:118px;aspect-ratio:1;border-radius:50%;background:#0f9e94;display:grid;
  place-items:center;text-align:center;line-height:1.1;padding:8px;
}
.ring-in b{font-size:30px;display:block}
.ring-in span{font-size:11px;opacity:.88;display:block;margin-top:5px}

.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:14px}
.stat{background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px 15px;display:flex;align-items:baseline;gap:8px;box-shadow:0 2px 8px rgba(20,60,50,.03)}
.stat b{font-size:22px;color:var(--teal-dark);line-height:1}
.stat span{font-size:12px;color:var(--muted)}

.two{display:grid;grid-template-columns:1.15fr .85fr;gap:14px;margin-top:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow)}
.card-pad{padding:18px 20px}
.card h3{margin:0 0 10px;font-size:15px;display:flex;align-items:center;gap:7px}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{background:#f2f8f6;border:1px solid #e2efeb;border-radius:999px;padding:4px 10px;font-size:12px;color:#42605a}
.tips ul{margin:0;padding-left:18px;color:#4d6560;font-size:13.5px;line-height:1.95}
.tips li::marker{color:var(--teal)}

.grouphead{display:flex;align-items:center;gap:10px;margin:26px 2px 10px}
.grouphead h2{margin:0;font-size:18px}
.grouphead .pct{background:#fff;border:1px solid var(--line);border-radius:999px;padding:2px 10px;font-size:12px;color:var(--muted)}
.grouphead .line{flex:1;height:1px;background:var(--line)}

.secgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.seccard{
  display:flex;align-items:center;gap:13px;width:100%;text-align:left;background:#fff;
  border:1px solid var(--line);border-left:5px solid var(--accent);border-radius:16px;
  padding:14px 15px;transition:.15s;box-shadow:0 2px 8px rgba(20,60,50,.03);
}
.seccard:hover{transform:translateY(-2px);box-shadow:0 10px 24px rgba(20,60,50,.09);border-color:var(--accent)}
.secicon{
  width:46px;height:46px;border-radius:14px;background:var(--accent-soft);
  display:grid;place-items:center;font-size:23px;flex:0 0 auto;
}
.secbody{min-width:0;flex:1}
.secname{display:flex;align-items:center;gap:7px;font-size:14.5px;font-weight:700;line-height:1.3}
.secname em{font-style:normal;font-size:10.5px;font-weight:600;color:var(--accent);background:var(--accent-soft);border-radius:999px;padding:1px 6px;white-space:nowrap}
.secdesc{display:block;font-size:11.5px;color:var(--muted);line-height:1.45;margin-top:3px;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.secbar{display:block;height:5px;background:#eef4f2;border-radius:999px;overflow:hidden;margin-top:7px}
.secbar i{display:block;height:100%;background:var(--accent);border-radius:999px;transition:width .25s}
.secright{text-align:right;flex:0 0 auto;font-size:11.5px;color:var(--muted);line-height:1.35}
.secright b{display:block;font-size:14px;color:var(--accent);font-variant-numeric:tabular-nums}
.secright span{display:block;margin-top:4px;font-weight:600}
.secright .done{color:var(--good)}

.footnote{text-align:center;color:#9aaba6;font-size:11.5px;margin-top:28px;line-height:1.8}

/* ---------- quiz ---------- */
.quiztop{position:sticky;top:0;z-index:30;background:rgba(242,250,247,.9);backdrop-filter:blur(12px);padding:10px 0 8px;margin-bottom:8px}
.quiztop-in{
  background:#fff;border:1px solid var(--line);border-radius:16px;padding:9px 12px;
  display:flex;align-items:center;gap:9px;flex-wrap:wrap;box-shadow:0 4px 16px rgba(20,60,50,.05);
}
.quiztop .qtitle{font-size:14px;font-weight:700;line-height:1.2;min-width:0}
.quiztop .qtitle small{display:block;font-size:11px;color:var(--muted);font-weight:500;margin-top:2px}
.quiztop .spacer{flex:1}
.pill{
  border:1px solid var(--line);background:#fff;border-radius:999px;padding:5px 11px;
  font-size:12px;color:#4d6560;white-space:nowrap;font-weight:500;
}
.pill:hover{background:#f5fbf9}
.pill.on{background:#e9f8f5;border-color:#bfe8e1;color:var(--teal-dark);font-weight:700}
.pill.danger{color:var(--bad);border-color:#f0d2cd}
.progress{height:6px;background:#e4efec;border-radius:999px;overflow:hidden;margin:2px 0 12px}
.progress i{display:block;height:100%;background:linear-gradient(90deg,var(--teal),#54c9bb);border-radius:999px;transition:width .25s}

.palette{background:#fff;border:1px solid var(--line);border-radius:14px;margin-bottom:12px;overflow:hidden}
.palette summary{cursor:pointer;padding:10px 14px;font-size:13px;color:#4d6560;list-style:none;display:flex;align-items:center;gap:8px;user-select:none}
.palette summary::-webkit-details-marker{display:none}
.palette summary::before{content:"▸";color:#8aa39d;transition:.15s;font-size:12px}
.palette[open] summary::before{transform:rotate(90deg)}
.palette summary b{color:var(--teal-dark)}
.palette summary .pmeta{margin-left:auto;font-size:11.5px;color:#9aaba6}
.pgrid{display:grid;grid-template-columns:repeat(10,1fr);gap:6px;padding:4px 12px 14px;max-height:232px;overflow:auto}
.pbtn{
  aspect-ratio:1;border-radius:8px;border:1px solid #e3ece9;background:#fff;
  font-size:11.5px;color:#6c7d79;font-variant-numeric:tabular-nums;transition:.12s;padding:0;
}
.pbtn:hover{border-color:#a9ddd5;background:#f7fdfb}
.pbtn.ok{background:#e7f7ef;border-color:#b9e3cd;color:var(--good);font-weight:700}
.pbtn.no{background:#fdecea;border-color:#f2c4bd;color:var(--bad);font-weight:700}
.pbtn.cur{outline:2px solid var(--teal);outline-offset:1px}

.qcard{background:#fff;border:1px solid var(--line);border-radius:20px;box-shadow:0 10px 30px rgba(20,60,50,.06);padding:24px 26px 20px;animation:pop .2s ease}
@keyframes pop{from{opacity:.55;transform:translateY(4px)}to{opacity:1;transform:none}}
.qhead{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.qno{font-size:13px;font-weight:800;color:var(--teal-dark);background:#e8f8f5;border-radius:8px;padding:3px 8px;white-space:nowrap}
.tag{font-size:11.5px;color:#5b716c;background:#f3f7f6;border-radius:999px;padding:2px 9px;white-space:nowrap}
.tag.ghost{background:#fff;border:1px solid var(--line)}
.qstatus{margin-left:auto;font-size:12px;color:var(--muted);white-space:nowrap}
.qstatus.ok{color:var(--good);font-weight:700}
.qstatus.no{color:var(--bad);font-weight:700}
.qprompt{font-size:19px;font-weight:650;line-height:1.55;margin:2px 0 14px;color:#1e332f}
.qprompt .blank{display:inline-block;min-width:74px;border-bottom:1.5px solid #9ec9c1;margin:0 3px}

.passage{border:1px solid #e6efec;background:#f8fcfb;border-radius:12px;padding:10px 14px;margin:0 0 14px}
.passage summary{cursor:pointer;font-size:13px;color:var(--teal-dark);font-weight:600;list-style:none}
.passage summary::-webkit-details-marker{display:none}
.passage summary::before{content:"📖 ";}
.passage p{margin:9px 0 0;font-size:15px;line-height:1.95;color:#334b46}

.audiobox{
  display:flex;align-items:center;gap:10px;flex-wrap:wrap;
  background:linear-gradient(180deg,#f2fbf9,#f9fdfc);border:1px solid #dff1ed;
  border-radius:14px;padding:10px 12px;margin-bottom:16px;
}
.playbtn{
  background:var(--teal);color:#fff;border:0;border-radius:999px;padding:9px 18px;
  font-weight:700;display:inline-flex;align-items:center;gap:7px;
  box-shadow:0 4px 12px rgba(13,159,149,.25);transition:.15s;
}
.playbtn:hover{background:var(--teal-dark)}
.slowbtn{
  border:1px solid #cfe8e3;background:#fff;border-radius:999px;padding:8px 13px;
  font-size:12.5px;color:#4d6560;font-weight:600;
}
.slowbtn:hover{background:#f2fbf9}
.slowbtn.on{background:#e9f8f5;border-color:#9ed9d0;color:var(--teal-dark)}
.wave{display:flex;align-items:center;gap:3px;height:22px;min-width:34px}
.wave i{display:block;width:3px;height:7px;border-radius:2px;background:#8fd8cf;transition:height .1s}
.audiobox.playing .wave i{animation:wave .7s ease-in-out infinite}
.audiobox.playing .wave i:nth-child(2){animation-delay:.1s}
.audiobox.playing .wave i:nth-child(3){animation-delay:.2s}
.audiobox.playing .wave i:nth-child(4){animation-delay:.3s}
.audiobox.playing .wave i:nth-child(5){animation-delay:.4s}
@keyframes wave{0%,100%{height:6px}50%{height:20px}}
.audiotip{font-size:11.5px;color:var(--muted);margin-left:auto;white-space:nowrap}

.optlist{display:flex;flex-direction:column;gap:9px}
.opt{
  display:flex;align-items:center;gap:11px;width:100%;text-align:left;background:#fff;
  border:1.5px solid #e4ecea;border-radius:12px;padding:12px 14px;font-size:16px;transition:.12s;
}
.opt:hover:not(.locked){border-color:#a9ddd5;background:#fbfffe}
.opt .olabel{width:24px;height:24px;border-radius:50%;background:#f0f6f4;display:grid;place-items:center;font-size:12px;font-weight:700;color:#647a75;flex:0 0 auto}
.opt .otext{flex:1;min-width:0;line-height:1.5}
.opt .omark{font-size:14px;font-weight:800;min-width:20px;text-align:right}
.opt.correct{border-color:#7fcfab;background:#f1fbf6}
.opt.correct .olabel{background:#d9f5e7;color:var(--good)}
.opt.wrong{border-color:#eba9a0;background:#fdf3f1}
.opt.wrong .olabel{background:#f9dcd7;color:var(--bad)}
.opt.locked{cursor:default}

.picgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.picopt{
  position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;
  min-height:132px;background:#fff;border:1.5px solid #e4ecea;border-radius:16px;padding:12px;transition:.12s;
}
.picopt:hover:not(.locked){border-color:#a9ddd5;background:#fbfffe}
.picicon{font-size:42px;line-height:1;display:flex;align-items:center;justify-content:center;min-height:50px;text-align:center}
.picicon svg{width:74px;height:74px;display:block}
.picnum{font-size:34px;font-weight:800;color:#2c4742;letter-spacing:.04em;line-height:1}
.piclabel{font-size:12.5px;color:#5b716c;opacity:0;transition:.15s;text-align:center;line-height:1.3;min-height:16px}
.answered .piclabel{opacity:1}
.picopt.correct{border-color:#7fcfab;background:#f1fbf6}
.picopt.wrong{border-color:#eba9a0;background:#fdf3f1}
.picopt .badge{position:absolute;top:8px;right:10px;font-size:15px}
.mini{font-size:.55em;vertical-align:super;background:#e8f8f5;border-radius:6px;padding:1px 4px;color:var(--teal-dark);font-weight:800}
.clockface{width:92px;height:92px;display:block}
.clockwrap{display:flex;justify-content:center;padding:10px 0 6px}
.clockwrap .clockface{width:172px;height:172px;filter:drop-shadow(0 6px 14px rgba(20,60,50,.08))}

.answerbox{margin-top:4px}
.hintline{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:8px}
.hint{font-size:13px;color:#5b716c;background:#f4f8f7;border-radius:8px;padding:3px 9px}
.tiny{border:1px solid var(--line);background:#fff;border-radius:999px;padding:3px 9px;font-size:11.5px;color:var(--muted)}
.tiny:hover{background:#f5fbf9}
.inputrow{display:flex;gap:9px;flex-wrap:wrap}
.inputrow input{
  flex:1;min-width:220px;border:1.5px solid #dce8e5;border-radius:12px;padding:12px 14px;
  font-size:18px;outline:none;font-family:"Segoe UI","Trebuchet MS",system-ui,sans-serif;
  letter-spacing:.02em;background:#fff;color:#20302d;
}
.inputrow input:focus{border-color:var(--teal);box-shadow:0 0 0 3px rgba(13,159,149,.12)}
.inputrow input:disabled{background:#f7faf9;color:#5b716c}
.inputrow input::placeholder{color:#a9b8b4;font-size:14px;letter-spacing:0}
.letterhint{margin-top:8px;font-size:12.5px;color:#8f6310;background:#fff8e8;border:1px solid #f1e0b8;border-radius:8px;padding:6px 10px}
.letterhint.hidden{display:none}

.feedback{margin-top:16px;border-radius:14px;padding:13px 16px;animation:pop .18s ease}
.feedback.ok{background:#f0fbf6;border:1px solid #c9ecd9}
.feedback.bad{background:#fdf4f2;border:1px solid #f2d2cc}
.fbtop{display:flex;align-items:center;gap:8px;font-size:15px}
.fbtop b{font-size:15.5px}
.fbicon{font-size:18px}
.fbanswer{margin-top:7px;font-size:14px;color:#3f5853}
.fbanswer b{color:var(--good);font-size:16px}
.fbexplain{margin-top:7px;font-size:13.5px;line-height:1.8;color:#4d6560}
.fbexplain b{color:#2c4742}
.fbuser{margin-top:5px;font-size:12.5px;color:#8a6a64}
.fbuser b{color:var(--bad)}

.qfoot{display:flex;align-items:center;gap:10px;margin-top:22px;padding-top:16px;border-top:1px solid #eef3f2}
.qfoot .spacer{flex:1}
.qfoot .pos{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.keyhint{text-align:center;font-size:11.5px;color:#9aaba6;margin-top:12px}

/* ---------- result ---------- */
.resulthero{
  background:linear-gradient(135deg,#0d9f95,#4cc9b8);border-radius:22px;color:#fff;
  padding:26px 28px;display:flex;align-items:center;gap:26px;flex-wrap:wrap;
  box-shadow:0 18px 40px rgba(13,159,149,.2);
}
.resulthero .ring-in{background:#0f9e94}
.resulthero h1{font-size:30px;margin:4px 0;line-height:1.2}
.resulthero p{margin:0;opacity:.92;font-size:14px}
.resulthero .ractions{margin-left:auto;display:flex;gap:9px;flex-wrap:wrap}
.resulthero .btn.primary{background:#fff;border-color:#fff;color:var(--teal-dark)}
.resulthero .btn.ghost{border-color:rgba(255,255,255,.7);color:#fff}
.statgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:14px}
.bigstat{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px 16px;box-shadow:0 2px 8px rgba(20,60,50,.03)}
.bigstat b{display:block;font-size:24px;color:var(--teal-dark);line-height:1.2}
.bigstat span{font-size:12px;color:var(--muted)}
.breakdown{margin-top:16px;overflow:hidden}
.breakdown .card-pad{padding-top:16px}
.breakdown table{width:100%;border-collapse:collapse;font-size:13.5px}
.breakdown th,.breakdown td{padding:9px 6px;border-bottom:1px solid #eef3f2;text-align:left;vertical-align:middle}
.breakdown th{font-size:11.5px;color:var(--muted);font-weight:600}
.breakdown tr:last-child td{border-bottom:0}
.breakdown td.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.minibar{height:7px;background:#edf4f2;border-radius:999px;overflow:hidden;min-width:80px}
.minibar i{display:block;height:100%;background:var(--teal);border-radius:999px}
.wronglist{margin-top:18px}
.wronglist h3{margin:0 2px 10px;font-size:16px}
.wrongcard{
  display:flex;gap:10px;align-items:flex-start;background:#fff;border:1px solid var(--line);
  border-left:4px solid #eba9a0;border-radius:12px;padding:12px 14px;margin-bottom:8px;
}
.wrongcard .wq{font-size:12px;color:var(--muted);white-space:nowrap;font-weight:700}
.wrongcard .wt{flex:1;min-width:0;font-size:13.5px;line-height:1.5}
.wrongcard .wa{font-size:12.5px;color:var(--good);margin-top:4px}
.wrongcard .btn{flex:0 0 auto}
.emptygood{background:#f0fbf6;border:1px solid #c9ecd9;border-radius:14px;padding:18px;text-align:center;color:var(--good);font-weight:600}

/* ---------- modal / toast ---------- */
.modal{position:fixed;inset:0;background:rgba(16,40,36,.46);display:none;place-items:center;padding:18px;z-index:100}
.modal.on{display:grid}
.modalbox{background:#fff;border-radius:20px;max-width:640px;width:100%;max-height:82vh;overflow:auto;padding:22px 24px;box-shadow:0 24px 60px rgba(0,0,0,.25)}
.modalbox h2{margin:0 0 10px;font-size:18px}
.modalbox p{margin:0 0 10px;font-size:14.5px;line-height:1.9;color:#405853}
.modalbox .close{margin-top:14px;display:flex;justify-content:flex-end}
.toast{
  position:fixed;left:50%;bottom:26px;transform:translate(-50%,16px);background:#20302d;color:#fff;
  padding:9px 18px;border-radius:999px;font-size:13px;opacity:0;pointer-events:none;transition:.22s;z-index:120;
  box-shadow:0 10px 26px rgba(0,0,0,.2);max-width:90vw;text-align:center;
}
.toast.on{opacity:1;transform:translate(-50%,0)}

/* ---------- speech rate / TTS ---------- */
.ratebox{
  display:inline-flex;align-items:center;gap:6px;background:#fff;border:1px solid var(--line);
  border-radius:999px;padding:4px 10px;white-space:nowrap;vertical-align:middle;
}
.rateend{font-size:11px;line-height:1;opacity:.72}
.rate{
  -webkit-appearance:none;appearance:none;width:88px;height:4px;border-radius:999px;
  background:linear-gradient(90deg,#bfe8e1,#0d9f95);outline:none;cursor:pointer;accent-color:var(--teal);
}
.rate::-webkit-slider-thumb{
  -webkit-appearance:none;appearance:none;width:15px;height:15px;border-radius:50%;
  background:#fff;border:2.5px solid var(--teal);box-shadow:0 1px 4px rgba(13,159,149,.35);cursor:pointer;
}
.rate::-moz-range-thumb{width:13px;height:13px;border-radius:50%;background:#fff;border:2.5px solid var(--teal);cursor:pointer}
.ratebadge{font-size:11.5px;font-weight:700;color:var(--teal-dark);min-width:35px;text-align:center;font-variant-numeric:tabular-nums}
.homesettings{margin-top:14px}
.homesettings .ratebox{display:inline-flex}
.ratehint{margin:9px 0 0;font-size:12.5px;color:var(--muted);line-height:1.7}
.homesettings-foot{margin-top:10px;display:flex;gap:8px;flex-wrap:wrap}

.saybtn{
  display:inline-grid;place-items:center;width:26px;height:26px;border-radius:50%;
  background:#eaf8f5;border:1px solid #c8e9e3;color:var(--teal-dark);
  font-size:12.5px;line-height:1;cursor:pointer;user-select:none;vertical-align:middle;
  margin-left:6px;flex:0 0 auto;transition:.14s;
}
.saybtn:hover{background:#d9f4ee;border-color:#9ed9d0;transform:scale(1.06)}
.saybtn:active{transform:scale(.96)}
.saybtn:focus-visible{outline:2px solid var(--teal);outline-offset:2px}
.saybtn.inline{width:24px;height:24px;font-size:12px}
.saybtn.optsay{width:25px;height:25px;margin-left:4px}
.saybtn.picsay{position:absolute;top:8px;left:8px;width:25px;height:25px;background:#fff;opacity:.82;z-index:2}
.saybtn.picsay:hover{opacity:1}
.saybtn.wide{
  display:inline-flex;align-items:center;gap:5px;width:auto;height:32px;border-radius:999px;
  padding:0 12px;font-size:12.5px;font-weight:600;margin-left:0;
}
.saybtn.speaking{background:var(--teal);border-color:var(--teal);color:#fff;animation:saypulse .8s ease-in-out infinite}
@keyframes saypulse{0%,100%{box-shadow:0 0 0 0 rgba(13,159,149,.4)}50%{box-shadow:0 0 0 6px rgba(13,159,149,0)}}
.qprompt .saybtn{vertical-align:2px}
.passage summary .saybtn{vertical-align:-7px}
.fbsay{margin-top:8px;font-size:13px;color:#3f5853}
.fbsay-k{font-weight:600;color:#5b716c}
.fbsay .en{font-size:14.5px;color:#2c4742}
.fbsay .saybtn{vertical-align:-6px}
.lyricbox{margin-top:12px;background:#fff8ef;border:1px solid #f3e3cd;border-radius:12px;padding:12px 14px}
.lyrichead{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-weight:700;color:#a3541f;margin-bottom:8px}
.lyrichead .saybtn.wide{margin-left:auto}
.lyricbox p{margin:0;line-height:2.05;font-size:15px}
.lyricbox .saybtn{vertical-align:-7px}

/* ---------- responsive ---------- */
@media (max-width:820px){
  .hero{flex-direction:column;align-items:flex-start;padding:24px}
  .ring{position:absolute;right:16px;top:16px;width:102px}
  .ring-in{width:78px;padding:4px}
  .ring-in b{font-size:21px}
  .ring-in span{font-size:9px;margin-top:2px}
  .hero-main{padding-right:88px}
  .two{grid-template-columns:1fr}
  .secgrid{grid-template-columns:1fr}
  .stats{grid-template-columns:repeat(2,1fr)}
  .qcard{padding:18px 16px}
  .qprompt{font-size:17px}
  .pgrid{grid-template-columns:repeat(8,1fr)}
  .statgrid{grid-template-columns:repeat(2,1fr)}
  .picgrid{gap:8px}
  .picopt{min-height:112px}
  .picicon{font-size:34px}
  .resulthero{padding:22px}
  .resulthero .ractions{margin-left:0;width:100%}
  .rate{width:72px}
}
@media (max-width:520px){
  .shell{padding:10px 10px 64px}
  .hero h1{font-size:26px}
  .hero-main{padding-right:76px}
  .hero-actions{width:100%}
  .hero-actions .btn{flex:1}
  .qprompt{font-size:16.5px}
  .inputrow input{font-size:17px;min-width:0;width:100%}
  .inputrow .btn{width:100%}
  .pgrid{grid-template-columns:repeat(6,1fr)}
  .audiotip{display:none}
  .qstatus{margin-left:0;width:100%}
  .breakdown{overflow-x:auto}
  .breakdown table{min-width:520px}
  .quiztop-in{gap:6px}
  .quiztop .qtitle{width:100%;order:2}
  .quiztop .spacer{display:none}
  .ratebox{padding:4px 8px;gap:4px}
  .rate{width:56px}
  .ratebadge{min-width:31px}
  .saybtn.picsay{top:6px;left:6px}
}
</style>
</head>
<body>
<div class="shell" id="app"></div>
<div class="toast" id="toast"></div>
<div class="modal" id="modal" aria-hidden="true">
  <div class="modalbox" id="modalbox"></div>
</div>
<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
